<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizen & Admin Login | Complaint Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Minimal Header -->
    <nav class="navbar navbar-dark bg-dark py-2">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <i class="bi bi-shield-check fs-4"></i>
                <span>Grievance<span style="color:#60a5fa;">Portal</span></span>
            </a>
            <a href="index.html" class="btn btn-outline-light btn-sm"><i class="bi bi-house-door me-1"></i>Back to Home</a>
        </div>
    </nav>

    <main class="d-flex align-items-center justify-content-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-7 col-lg-5">
                    <div class="card custom-card shadow-sm p-4">
                        <div class="card-body">
                            <div class="text-center mb-4">
                                <div class="rounded-circle bg-primary bg-opacity-10 text-primary d-inline-flex align-items-center justify-content-center mb-2" style="width:56px; height:56px; font-size:1.75rem;">
                                    <i class="bi bi-lock-fill"></i>
                                </div>
                                <h4 class="fw-bold mb-1">Sign In to Your Account</h4>
                                <p class="text-muted small">Access your personal dashboard to lodge and track complaints</p>
                            </div>

                            <!-- Alert Box for Error Messages -->
                            <div id="login-alert" class="alert alert-danger d-none py-2 small" role="alert"></div>

                            <form id="loginForm">
                                <div class="mb-3">
                                    <label for="email" class="form-label small fw-semibold">Email Address</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                        <input type="email" class="form-control" id="email" placeholder="name@example.com" required autofocus>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <div class="d-flex justify-content-between align-items-center mb-1">
                                        <label for="password" class="form-label small fw-semibold mb-0">Password</label>
                                    </div>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                                        <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">
                                    <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                                </button>
                            </form>

                            <!-- One-Click Demo Credentials for College Project Demonstration -->
                            <div class="p-3 bg-light rounded-3 border mb-3">
                                <span class="d-block small text-muted fw-semibold mb-2 text-center text-uppercase" style="font-size:0.75rem;">
                                    <i class="bi bi-magic me-1"></i>One-Click Demo Credentials
                                </span>
                                <div class="d-flex gap-2">
                                    <button type="button" class="btn btn-outline-primary btn-sm flex-fill" onclick="fillDemoCredentials('user')">
                                        <i class="bi bi-person me-1"></i>Citizen Demo
                                    </button>
                                    <button type="button" class="btn btn-outline-danger btn-sm flex-fill" onclick="fillDemoCredentials('admin')">
                                        <i class="bi bi-shield-lock me-1"></i>Admin Demo
                                    </button>
                                </div>
                            </div>

                            <div class="text-center pt-2">
                                <p class="small text-muted mb-0">
                                    Don't have an account yet? 
                                    <a href="register.html" class="fw-semibold text-primary text-decoration-none">Register as Citizen</a>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
