<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizen Registration | Complaint Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Minimal Header -->
    <nav class="navbar navbar-dark bg-dark py-2">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <i class="bi bi-shield-check fs-4"></i>
                <span>Grievance<span style="color:#60a5fa;">Portal</span></span>
            </a>
            <a href="index.html" class="btn btn-outline-light btn-sm"><i class="bi bi-house-door me-1"></i>Back to Home</a>
        </div>
    </nav>

    <main class="d-flex align-items-center justify-content-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="card custom-card shadow-sm p-4">
                        <div class="card-body">
                            <div class="text-center mb-4">
                                <div class="rounded-circle bg-success bg-opacity-10 text-success d-inline-flex align-items-center justify-content-center mb-2" style="width:56px; height:56px; font-size:1.75rem;">
                                    <i class="bi bi-person-plus-fill"></i>
                                </div>
                                <h4 class="fw-bold mb-1">Citizen Portal Registration</h4>
                                <p class="text-muted small">Create an account to submit community grievances and track real-time resolutions</p>
                            </div>

                            <!-- Alert Box for Messages -->
                            <div id="register-alert" class="alert alert-danger d-none py-2 small" role="alert"></div>

                            <div class="d-flex justify-content-end mb-3">
                                <button type="button" class="btn btn-outline-success btn-sm" onclick="fillRandomCitizenRegistration()">
                                    <i class="bi bi-dice-5-fill me-1"></i>Fill Random Citizen Details
                                </button>
                            </div>

                            <form id="registerForm">
                                <div class="mb-3">
                                    <label for="name" class="form-label small fw-semibold">Full Name</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                        <input type="text" class="form-control" id="name" placeholder="John Doe" required minlength="2" maxlength="100">
                                    </div>
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label for="email" class="form-label small fw-semibold">Email Address</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                            <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="phone" class="form-label small fw-semibold">Phone Number</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light"><i class="bi bi-telephone"></i></span>
                                            <input type="tel" class="form-control" id="phone" placeholder="9876543210" required pattern="^[0-9+\-\s()]{7,20}$">
                                        </div>
                                    </div>
                                </div>

                                <div class="row g-3 mb-4">
                                    <div class="col-md-6">
                                        <label for="password" class="form-label small fw-semibold">Password</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                                            <input type="password" class="form-control" id="password" placeholder="Min. 6 chars" required minlength="6">
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="confirmPassword" class="form-label small fw-semibold">Confirm Password</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light"><i class="bi bi-key-fill"></i></span>
                                            <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter password" required minlength="6">
                                        </div>
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">
                                    <i class="bi bi-person-check me-2"></i>Create Citizen Account
                                </button>
                            </form>

                            <div class="text-center pt-2 border-top">
                                <p class="small text-muted mb-0">
                                    Already have an account? 
                                    <a href="login.html" class="fw-semibold text-primary text-decoration-none">Sign In Here</a>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
